[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycopier"
version = "1.0.0"
authors = [{ name = "MetaRPC", email = "support@mrpc.pro" }]
description = "Official Python SDK for MetaRPC Trade Copier high-performance trade replication via gRPC"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "websockets>=12.0"
]
