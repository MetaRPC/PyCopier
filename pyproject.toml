[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycopier"
version = "1.0.0"
authors = [{ name = "MetaRPC", email = "support@mrpc.pro" }]
description = "Official Python SDK for MetaRPC Trade Copier high-performance trade replication via gRPC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
    "websockets>=14.0"
]
